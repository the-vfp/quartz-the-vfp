<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="'EB Garamond', Georgia, serif">
  <rect width="960" height="470" fill="#EFE6D4"/>
  <text x="48" y="56" font-size="30" fill="#9E4757" font-weight="500" font-family="'Playfair Display', Georgia, serif">Anne Elefante — Romantic Academia</text>
  <text x="48" y="80" font-size="13" fill="#A78B66" font-variant="small-caps" letter-spacing="3">Playfair Display · EB Garamond · two themes, one system</text>

  <text x="48" y="124" font-size="14" fill="#5A4A42" font-variant="small-caps" letter-spacing="3">Dark academia — primary shell</text>
  <g>
    <rect x="48"  y="138" width="138" height="110" rx="10" fill="#221A16"/>
    <rect x="202" y="138" width="138" height="110" rx="10" fill="#2A2019"/>
