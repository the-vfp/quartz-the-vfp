<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Anne Elefante favicon — the masthead elephant-head mark ("Curl" redraw,
       trunk curled up in a spiral at eye level) on a sticker chip, knocked out
       of the home page's rose: dusty-rose #9e4757 background, warm-cream
       #f4ecdc line, deeper-rose #8a3c4a hairline. Reversed (vs. cream chip /
       rose line) so it stands out in a browser tab. Stroke is thickened and
       the drawing padded vs. the inline PageTitle SVG so it stays legible down
       to 16x16. The drawing's optical center is (30.6 25.4). icon.png is
       rendered from this. -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#9e4757"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" fill="none" stroke="#8a3c4a" stroke-width="1.5"/>
  <g transform="translate(32 32) scale(0.95) translate(-30.6 -25.4)">
    <g fill="none" stroke="#f4ecdc" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M36 14 C 26 11 17 17 18 27 C 18 33 15 35.5 10.5 35 C 4.5 34 2.5 25.5 8.5 24 C 13 22.8 14.5 27.5 10 29.2"/>
      <path d="M36 14 C 39 14 40 15 41 16 C 54 13 58 29 49 37 C 45 39 42 37 41 32 C 39 34 37 38 34 38"/>
    </g>
    <circle cx="24" cy="28" r="1.8" fill="#f4ecdc"/>
  </g>
</svg>
